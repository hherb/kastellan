[package]
name        = "kastellan-supervisor"
description = "Service-supervisor abstraction: systemd --user (Linux) and launchd LaunchAgents (macOS)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
readme      = "../README.md"

[dependencies]
serde     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# macOS-only: the LaunchAgents backend needs `getuid()` to build the
# `gui/<uid>` domain target for `launchctl bootstrap` / `bootout`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

# macOS-only: the launchd smoke tests skip through the knob-routed
# `skip_if_no_supervisor` (`KASTELLAN_PG_REQUIRE_E2E`, the `launchd` gate
# profile — #872). A dev-only cycle (tests-common depends on this crate), the
# same kind core already has. Not on Linux because tests-common pulls in
# `core`, whose `ring` dep breaks the Mac → Linux cross-clippy of this crate.
[target.'cfg(target_os = "macos")'.dev-dependencies]
kastellan-tests-common = { path = "../tests-common" }
