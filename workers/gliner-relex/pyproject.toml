[project]
name = "kastellan-worker-gliner-relex"
version = "0.0.1"
description = "GLiNER-Relex inference worker for kastellan (Apache 2.0 model; JSON-RPC stdio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "kastellan contributors" }]
dependencies = [
    # GLiNER pulls the upstream `gliner` library (Apache 2.0). The
    # Knowledgator gliner-relex-* model weights load via this same lib;
    # no separate inference framework needed.
    #
    # The two floors below are COUPLED, and both are load-bearing:
    #
    #   * `transformers>=5.10.0` is the security floor — GHSA-xrqw-3rrv-vx5w
    #     (high), a `save_pretrained` path traversal, patched in 5.10.0:
    #     https://github.com/advisories/GHSA-xrqw-3rrv-vx5w
    #     Declared here rather than only bumped in `uv.lock`, so the
    #     vulnerable range is *unsatisfiable* rather than merely unlocked.
    #
    #   * `gliner>=0.2.28` is what makes that floor reachable. Observed
    #     2026-09-02: gliner 0.2.27 caps `transformers<5.7.0`, so with it in
    #     the graph the best `uv lock --upgrade-package transformers` can
    #     reach is 5.6.2 — still vulnerable, exiting 0 while saying nothing.
    #     0.2.28 raised the cap to `<5.14.0`. Bumping `transformers` alone
    #     does NOT fix the advisory; see issue #649.
    #
    # Consequence worth keeping: with both floors declared, a resolution that
    # tries to hold `gliner` at 0.2.27 is a hard conflict, not a silent
    # downgrade. The upper bound is still someone else's to move — the next
    # advisory patched at >=5.14.0 is unsatisfiable until gliner lifts its cap.
    "gliner>=0.2.28",
    "transformers>=5.10.0",
    "sentencepiece>=0.2",
    # Torch is implicit via transformers, but pin it explicitly so an
    # accidental wheel-resolution surprise (CUDA version mismatch) is
    # caught at uv sync time rather than at model load.
    "torch>=2.13.0",
    # anyio is a SECURITY FLOOR on a transitive dependency, not an import.
    # Nothing in this worker imports it; it arrives as
    #   gliner/transformers -> huggingface_hub -> httpx -> anyio
    # and it is declared here for the same reason `transformers` is (see
    # above): a declared floor makes the vulnerable range a hard conflict
    # rather than something a resolution can quietly satisfy.
    #
    # Both advisories are fixed in 4.14.2, and both list `< 4.14.2` as the
    # vulnerable range, so this one floor closes both:
    #
    #   * GHSA-82r6-8w77-94w6 (critical) -- `TLSStream` encodes host names with
    #     IDNA 2003, which can map a hostile name onto a different one and so
    #     enable TLS certificate spoofing:
    #     https://github.com/advisories/GHSA-82r6-8w77-94w6
    #   * GHSA-5p39-cfhj-2xmp (medium) -- an anyio process-pool worker can block
    #     indefinitely on undrained stderr:
    #     https://github.com/advisories/GHSA-5p39-cfhj-2xmp
    #
    # Why the floor and not just the lock bump: the macOS container image is
    # installed from THIS FILE, never from `uv.lock`. `Containerfile` copies
    # the lock, but then runs `uv pip install --system --no-cache .`, which
    # resolves from the `[project] dependencies` here -- so a lock-only bump
    # would have been entirely inert for that image.
    #
    # Reachability, recorded so the next reader need not re-derive it: runtime
    # exposure inside the jail is nil. Every entry that
    # `core/src/workers/gliner_relex/entry.rs` can produce -- host mode and
    # the macOS container mode -- sets `Net::Deny` alongside `HF_HUB_OFFLINE=1`
    # and `TRANSFORMERS_OFFLINE=1`, so no TLS is spoken from inside the jail at
    # all. (Both modes are pinned by `entry_denies_network*` in that module's
    # tests, so this sentence has a gate behind it.)
    #
    # Note what this floor does NOT govern, lest the next reader assume it:
    # the one-off weights download in `scripts/workers/gliner-relex/install.sh`
    # invokes a **PATH** `hf`, resolved at pre-flight before `uv sync` has even
    # created the venv -- so that is some other huggingface_hub, and some other
    # anyio. (`uv sync` is not a path to it either: uv is Rust and never loads
    # the anyio it installs.)
    "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[project.scripts]
# uv generates an executable shim at .venv/bin/kastellan-worker-gliner-relex
# equivalent to: python -m kastellan_worker_gliner_relex
# The manifest's `binary: PathBuf` field points at this shim — keeps
# the existing ToolEntry schema unchanged (no `args` field needed).
kastellan-worker-gliner-relex = "kastellan_worker_gliner_relex.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kastellan_worker_gliner_relex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
