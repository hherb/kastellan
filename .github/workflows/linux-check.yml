# Linux build smoke — the regression guard for issue #144.
#
# The dev machine is an Apple Silicon Mac; the DGX (the primary host) is
# the only routine Linux box. That left a gap: `kastellan-core` stopped
# compiling on Linux (issue #144 — `gliner_relex::container_mode_entry`
# referenced the macOS-only `SandboxBackendKind::Container` variant
# unconditionally) and nothing caught it until an operator built on the
# DGX. This workflow closes that gap by type-checking the whole workspace
# on a real Linux runner on every push/PR.
#
# Scope is deliberately compile-only:
#   * `cargo check --workspace --all-targets` — type-checks library,
#     binaries, AND test targets. `--all-targets` is what catches a
#     cfg-gating regression in `#[cfg(test)]` code (e.g. a container test
#     that references the macOS-only variant without a macOS gate).
#   * `cargo clippy --workspace --all-targets -- -D warnings` — promotes
#     every clippy warning to a hard error, so the job fails on any new
#     lint, not just deny-by-default ones (e.g. issue #150's
#     `clippy::uninit_vec`). The tree was made warning-clean in issue
#     #153; this `-D warnings` gate keeps it that way. A genuinely
#     unavoidable lint must be suppressed at the site with a justified
#     `#[allow(...)]`, which is reviewable in the diff.
#
# Both invocations pass `--locked`: Cargo.lock is committed, so the gate
# must build the exact pinned dependency graph and fail (not silently
# rewrite the lockfile) if it has drifted out of sync with the manifests.
#
# What this does NOT do: run the *full* test suite. Integration tests need
# a live Postgres cluster and the bwrap AppArmor profile; the full
# `cargo test --workspace` run stays operator/DGX-driven (see HANDOVER).
#
# The exceptions are the crates whose tests are hermetic (no Postgres, no
# bwrap, no KVM, no network) AND carry a guard whose whole value is firing on
# a pull request rather than on an operator's occasional DGX run. Each such
# step names its reason at the step itself; the rule for adding another is
# those two properties together, not hermeticity alone.
#
# The first was `kastellan-tests-common`, whose unit tests carry
# the structural guards that only pay off if they fire on a *pull request*:
# in particular `kernel_pin_is_the_only_place_the_kernel_url_appears`
# (issue #471), which exists to catch a contributor re-inlining an
# unverified kernel download into one of the eight build scripts. Leaving
# that to an operator's occasional DGX run would mean the drift it guards
# against is exactly the case least likely to be caught. `cargo test` does
# need real codegen where `check`/`clippy` do not, so this step costs more
# than the two above — deliberate, for a security guard on every PR.
#
# x86_64 is sufficient: the #144 break was `target_os`-conditional, not
# arch-conditional, so an x86_64 Linux check catches it just as well as
# the DGX's aarch64 — and x86_64 runners are the cheap default.

name: linux-check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: cargo check + clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets --locked

      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Hermetic guards only — see the header for why this one crate's
      # tests run here while the rest of the suite stays DGX-driven.
      - name: cargo test (tests-common — hermetic structural guards)
        run: cargo test -p kastellan-tests-common --locked

      # The mail worker's suite is hermetic for the same reason tests-common's
      # is: loopback-only mock HTTP, no Postgres, no bwrap, no KVM, and the
      # prelude's self-lockdown opted out per-test. It runs here because #536
      # measured the alternative — reverting `message_id: LocalmailId` to `i64`
      # (the #527 defect, 54% of live `mail.get_message` dispatches) left 31 of
      # 33 mail tests green, and the one failure was in `tests/mail_e2e.rs`,
      # which nothing in CI executed. The fixture self-consistency tests ran on
      # every PR while the behavioural pin ran nowhere. Same argument that put
      # `tests-common::installable` here after #504.
      - name: cargo test (mail worker — hermetic id/query contract)
        run: cargo test -p kastellan-worker-mail --locked

      # The three crates carrying #539's guards. Same argument as the two steps
      # above, and it applied the moment those tests were written: a signal-killed
      # child was reported as a SUCCESSFUL call with `exit_code: null`, and the
      # containment e2e tests that should have caught it asserted
      # `assert_ne!(exit_code, 0)` — which passes on `null`. The unit tests that
      # now pin the real behaviour are hermetic (no Postgres, no bwrap, no KVM,
      # no network), but the e2e tests that exercise them are DGX-only, so
      # without these steps the whole fix is guarded by nothing on a pull request.
      #
      # `--lib` on the prelude is deliberate: its six `tests/*.rs` integration
      # files need real bwrap + an unprivileged userns and would skip-as-pass
      # here, which is the false green this project treats as worse than a
      # failure. The two worker crates have no such targets — python-exec's
      # `tests/real_python.rs` needs only a system python3, which ubuntu-latest
      # has.
      - name: cargo test (worker prelude — child-exit classification, #539)
        run: cargo test -p kastellan-worker-prelude --lib --locked

      - name: cargo test (shell-exec — signal death is an error, #539)
        run: cargo test -p kastellan-worker-shell-exec --locked

      - name: cargo test (python-exec — signal death is an error, #539)
        run: cargo test -p kastellan-worker-python-exec --locked

      # The per-OS install defaults + the router's default local URL. Same
      # argument as every step above, with one twist that makes it sharper:
      # these modules encode BOTH platforms' values, but only one `cfg!` arm
      # compiles per host — so before #568 pinned the values in `const`s, a
      # mutation of any macOS default passed GitHub CI *and* the DGX leg, and
      # was killed only by the operator remembering to run the Mac leg. The
      # values are now assertable from either host; these steps make that
      # assertion actually run on every pull request.
      #
      # Module-scoped rather than whole-crate: both crates' wider suites need
      # Postgres (`kastellan-core`) or are covered by the DGX run. These two
      # paths are pure functions plus `ENV_LOCK`-scoped env reads — no PG, no
      # bwrap, no network.
      - name: cargo test (llm-router config — default local URL pin)
        run: "cargo test -p kastellan-llm-router --lib config:: --locked"

      - name: cargo test (core install plan — per-OS defaults, #568)
        run: "cargo test -p kastellan-core --lib install::plan:: --locked"

      # The guard-model tier (Shieldstral adjudicator + calibration
      # harness). Hermetic — pure functions, a tempdir corpus, and
      # loopback mocks; no PG, no bwrap, no model, no network.
      #
      # These satisfy the "whose value is firing on a PULL REQUEST"
      # clause above more sharply than most:
      #
      #   * `policy::` carries the cross-implementation digest pin. It
      #     exists so that a reword of the tuned prompt fails a test
      #     instead of silently moving every score — and a reword
      #     arrives in a diff, which is a PR event. The study's ablation
      #     moved a textbook indirect injection from 0.9998 to 0.0038 by
      #     changing only that block.
      #   * `guard_calibration::corpus::` holds
      #     `every_evasion_case_really_is_a_catalogue_miss`, which
      #     catches a future CATALOGUE entry silently invalidating a
      #     corpus case. That change arrives in someone ELSE's PR
      #     touching `injection_guard.rs` — exactly the case a per-PR
      #     gate must catch and an occasional operator run will not.
      #
      # The `guard` substring matches `cassandra::guard_model::` and
      # `guard_calibration::` in one step.
      - name: cargo test (core guard tier — prompt digest, corpus, report)
        run: "cargo test -p kastellan-core --lib guard --locked"

      # The adjudicator against a loopback mock. `--test` excludes
      # `#[ignore]`d cases by default, so the live Shieldstral sweep in
      # this file does not run here — same hermeticity argument as the
      # `kastellan-worker-mail` step above.
      - name: cargo test (core guard adjudicator e2e — loopback mock)
        run: "cargo test -p kastellan-core --test guard_model_e2e --locked"

      # `guard calibrate`'s EXIT STATUS. The counting is covered by the
      # unit tests above; what they cannot reach is the line that turns
      # "this run is not believable" into a non-zero exit, whose own
      # source comment is "a CI caller would read the zero and move on"
      # — so a CI caller is precisely who must exercise it.
      #
      # Spawns the CLI as a subprocess, so cargo links the binary for
      # this target. If it were ever absent the tests print `[SKIP]` and
      # PASS, which would make this step a silent no-op; the DGX
      # `--workspace` run is the cross-check that they really execute.
      - name: cargo test (guard calibrate CLI — exit-status contract)
        run: "cargo test -p kastellan-core --test guard_calibrate_cli_e2e --locked"

      # The guard-weights pin's REFUSAL (#592). The pure halves are
      # covered by `--lib guard` above and by the llm-router step below;
      # what neither reaches is the wiring that turns "these are not the
      # pinned weights" into a non-zero exit before any case is scored.
      #
      # Same `[SKIP]`-passes-silently caveat as the step above: these
      # spawn the CLI, so cargo links it for this target, and the DGX
      # `--workspace` run is the cross-check that they really execute.
      - name: cargo test (guard weights pin CLI — refusal contract)
        run: "cargo test -p kastellan-core --test guard_weights_pin_cli_e2e --locked"

      # The CLI binary's OWN unit tests. `--lib guard` above covers the
      # library half; nothing covered `kastellan-cli`'s `#[cfg(test)]`
      # modules, and `apply_opt_out` — which decides whether a run may
      # proceed on unverified weights — lives there. Its accepting arm
      # is the one no fixture can reach through the CLI (no test can
      # produce the pinned 3.6 GB file), so this is the only gate that
      # stops "refuse unconditionally" passing the suite.
      - name: cargo test (kastellan-cli binary — weights opt-out policy)
        run: "cargo test -p kastellan-core --bin kastellan-cli --locked"

      # `/props` is how the weights pin learns which file llama-server
      # opened — llama.cpp reports an empty `digest`, so the path is the
      # only thing the endpoint can tell us. The URL derivation is the
      # subtle half (it strips the OpenAI-compat segment where every
      # other route appends to it), so both it and the fetch are gated.
      - name: cargo test (llm-router /props — guard-weights provenance)
        run: |
          cargo test -p kastellan-llm-router --lib props_url --locked
          cargo test -p kastellan-llm-router --test props_e2e --locked

  # `uv.lock` is the one committed lockfile in this repo with NO drift gate.
  # Every cargo step above passes `--locked`, so a `Cargo.toml` edit that was
  # not followed by a `cargo` run fails the build instead of silently rewriting
  # the lockfile. `workers/gliner-relex/uv.lock` had no equivalent, and issue
  # #649 is what made that asymmetry expensive: the advisory fix had to move
  # BOTH a `pyproject.toml` floor and the lock, and nothing would have noticed
  # the two disagreeing.
  #
  # SCOPE, precisely: `uv lock --check` proves the manifest and the lock AGREE.
  # It does not judge what they agree ON. The pre-#649 tree — `transformers`
  # pinned at a version inside GHSA-xrqw-3rrv-vx5w — passes this job with exit
  # 0, because its floor and its lock were perfectly consistent with each
  # other. Advisories are covered separately, by Dependabot alerts on the repo
  # (that is what filed #649 and opened #647); this job is a DRIFT gate and
  # nothing more. What it does catch, and what makes it worth having here, is a
  # silently WEAKENED floor: reverting `transformers>=5.10.0` without
  # regenerating the lock exits 1, because uv compares recorded requirements
  # for equality rather than satisfaction.
  #
  # `--offline` makes it hermetic: a complete lockfile is validated from its own
  # recorded metadata, no PyPI round-trip, so this job satisfies the header's
  # bar (no Postgres, no bwrap, no KVM, no network) and takes seconds. Its one
  # rough edge is the error it produces for a NEW dependency added without
  # re-locking: uv cannot resolve offline and prints a version-availability wall
  # rather than "run uv lock", so the step below says so itself.
  #
  # It runs on every pull request and every `main` push — cheap enough not to
  # need a `paths:` filter. It installs no Python PACKAGES: the worker's mocked
  # pytest suite is deliberately left out, because it needs ~2 GB of torch, and
  # the one test that could not be mocked (the real model load in
  # `tests/test_model_live.py`) needs 1.3 GB of weights this runner has no
  # business staging. That one stays operator-driven, with
  # `KASTELLAN_GLINER_RELEX_REQUIRE_E2E=1` as the knob that stops it skipping
  # silently.
  #
  # The pure guard tests in that same file ARE run, though — they import only
  # `pathlib`, `typing` and `pytest`, so they cost a second and no torch. They
  # are what pins the weights-resolution rules against their Rust counterpart in
  # `kastellan-tests-common::gliner_weights`; a drift between the two halves
  # arrives in a diff, which is exactly a pull-request event.
  python-lock-check:
    name: uv lock --check (gliner-relex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: an unpinned uv is a silent input to a gate whose whole job is
      # to detect change. `docs.yml` uses the same major.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: uv lock --check (pyproject and uv.lock agree)
        working-directory: workers/gliner-relex
        run: |
          uv lock --check --offline || {
            echo "::error file=workers/gliner-relex/pyproject.toml::pyproject.toml and uv.lock disagree - run 'uv lock' in workers/gliner-relex and commit the result"
            exit 1
          }

      # No torch, no weights, no model: `test_model_live.py`'s helper tests are
      # pure functions over an injected environment. `--no-project` keeps uv
      # from installing the worker (and its ~2 GB of dependencies) just to run
      # them.
      #
      # The live model test is deselected EXPLICITLY rather than left to
      # skip-as-pass. Under `--no-project` the worker package is not importable,
      # so on any host that does happen to have the weights staged the test
      # would reach its `import kastellan_worker_gliner_relex` and ERROR rather
      # than skip. Relying on "the runner has no weights" would make this step
      # pass for a reason that is not the reason stated. `REQUIRE_E2E` is
      # deliberately unset here, so `conftest.py`'s session guard stays quiet.
      #
      # `test_scratch.py` (#719) runs in a SEPARATE command with `src` on
      # PYTHONPATH, so the first command keeps the "package not importable"
      # premise above. It needs no torch either: the helpers are pure, and its
      # import-order test only checks that importing the entry point does NOT
      # load torch. With no torch installed, a regression that imports it at the
      # top of `__main__.py` fails here with ImportError, so the test cannot pass
      # by accident on this runner.
      - name: pytest (pure guards only; no torch)
        working-directory: workers/gliner-relex
        run: |
          uv run --no-project --with pytest pytest tests/test_model_live.py -q -rs \
            --deselect tests/test_model_live.py::test_real_model_loads_and_extracts
          PYTHONPATH=src uv run --no-project --with pytest pytest tests/test_scratch.py -q -rs

  # The Matrix worker's live SDK path (`workers/matrix/src/sdk_live.rs`) is
  # behind the optional `live-matrix` feature (`dep:matrix-sdk`). The `check`
  # job above builds the default `--workspace`, which deliberately excludes that
  # heavy, non-hermetic dependency — so a regression under `--features
  # live-matrix` shipped silently until a DGX build caught it (issue #331). This
  # job closes the gap by compiling + linting just that one crate with the
  # feature on. It is a separate job (not a step in `check`) so the fast default
  # gate stays light and hermetic; the two run in parallel.
  #
  # `--all-targets` mirrors the `check` job above for the same reason: it also
  # type-checks + lints the crate's `#[cfg(test)]` code, including the
  # feature-gated test modules in `sdk_live.rs` (and its `#[cfg(all(test,
  # feature = "live-matrix"))]` sibling wired in at `main.rs`). Without it those
  # test modules are compiled by NO CI job — the default `check` excludes them
  # (feature off) and a bare `cargo check` here excludes them (test cfg off) —
  # so a regression there would still ship silently to the DGX, defeating #331.
  matrix-live-check:
    name: cargo check + clippy (matrix worker, live-matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo check (matrix worker, all targets, live-matrix feature)
        run: cargo check -p kastellan-worker-matrix --all-targets --features live-matrix --locked

      - name: cargo clippy (matrix worker, all targets, live-matrix feature, deny warnings)
        run: cargo clippy -p kastellan-worker-matrix --all-targets --features live-matrix --locked -- -D warnings
